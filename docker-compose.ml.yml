# ==============================================================================
# Class Royale — Local Machine Learning Service Compose
# For isolated local development without interfering with the Next.js application
# ==============================================================================

version: '3.8'

services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: class-royale-ml-service
    ports:
      - "8000:8000"
    environment:
      - ML_ENV=development
      - ML_MODE=placeholder
      - DEMO_MODE=false
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      # Mount artifacts and datasets for persistent storage and active training
      - ./ml-service/artifacts:/app/artifacts
      - ./ml-service/datasets:/app/datasets
      # Mount app code for live reload during development
      - ./ml-service/app:/app/app:ro
    restart: unless-stopped
    networks:
      - class-royale-net

networks:
  class-royale-net:
    driver: bridge
