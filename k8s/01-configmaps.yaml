apiVersion: v1
kind: ConfigMap
metadata:
  name: class-royale-web-config
  namespace: class-royale
  labels:
    app.kubernetes.io/name: web-app
    app.kubernetes.io/part-of: class-royale
    app.kubernetes.io/component: frontend
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  # Internal Kubernetes cluster DNS for the ML microservice
  ML_SERVICE_URL: "http://ml-service.class-royale.svc.cluster.local:8000"
  AI_PROVIDER: "socratic"
  AI_DAILY_REQUEST_LIMIT: "200"
  AI_MAX_OUTPUT_TOKENS: "2048"
  AI_MAX_CONTEXT_MESSAGES: "16"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: class-royale-ml-config
  namespace: class-royale
  labels:
    app.kubernetes.io/name: ml-service
    app.kubernetes.io/part-of: class-royale
    app.kubernetes.io/component: ml-engine
data:
  ML_ENV: "production"
  ML_MODE: "active"
  LOG_LEVEL: "INFO"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  DEMO_MODE: "false"
