apiVersion: v1
kind: Secret
metadata:
  name: class-royale-secrets
  namespace: class-royale
  labels:
    app.kubernetes.io/name: class-royale
    app.kubernetes.io/part-of: class-royale
type: Opaque
stringData:
  # JWT Secret for session authentication & token verification
  JWT_SECRET: "class-royale-k8s-production-super-secret-key-change-me"
  
  # Supabase Cloud Database Connection (or internal Postgres)
  NEXT_PUBLIC_SUPABASE_URL: "https://your-supabase-project.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "your-supabase-anon-key"
  SUPABASE_SERVICE_ROLE_KEY: "your-supabase-service-role-key"
  DATABASE_URL: "postgresql://postgres:yourpassword@db.supabase.co:5432/postgres?sslmode=require"

  # Mistral API Access for live Socratic Tutor LLM generation
  MISTRAL_API_KEY: "your-mistral-api-key"
