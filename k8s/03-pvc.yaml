apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-artifacts-pvc
  namespace: class-royale
  labels:
    app.kubernetes.io/name: ml-service
    app.kubernetes.io/part-of: class-royale
    app.kubernetes.io/component: ml-engine
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: web-sqlite-pvc
  namespace: class-royale
  labels:
    app.kubernetes.io/name: web-app
    app.kubernetes.io/part-of: class-royale
    app.kubernetes.io/component: frontend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
