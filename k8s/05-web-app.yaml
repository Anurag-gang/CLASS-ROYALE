apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: class-royale
  labels:
    app.kubernetes.io/name: web-app
    app.kubernetes.io/part-of: class-royale
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
        app.kubernetes.io/name: web-app
        app.kubernetes.io/part-of: class-royale
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: web-app
          image: class-royale-web-app:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http-web
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: class-royale-web-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: class-royale-secrets
                  key: JWT_SECRET
            - name: NEXT_PUBLIC_SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: class-royale-secrets
                  key: NEXT_PUBLIC_SUPABASE_URL
                  optional: true
            - name: NEXT_PUBLIC_SUPABASE_ANON_KEY
              valueFrom:
                secretKeyRef:
                  name: class-royale-secrets
                  key: NEXT_PUBLIC_SUPABASE_ANON_KEY
                  optional: true
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: class-royale-secrets
                  key: SUPABASE_SERVICE_ROLE_KEY
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: class-royale-secrets
                  key: DATABASE_URL
                  optional: true
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: web-app
  namespace: class-royale
  labels:
    app.kubernetes.io/name: web-app
    app.kubernetes.io/part-of: class-royale
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    app: web-app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
