apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: class-royale-ingress
  namespace: class-royale
  labels:
    app.kubernetes.io/name: class-royale
    app.kubernetes.io/part-of: class-royale
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - classroyale.edu
        - www.classroyale.edu
      secretName: class-royale-tls-certs
  rules:
    - host: classroyale.edu
      http:
        paths:
          - path: /api/ml
            pathType: Prefix
            backend:
              service:
                name: ml-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-app
                port:
                  number: 3000
    - host: www.classroyale.edu
      http:
        paths:
          - path: /api/ml
            pathType: Prefix
            backend:
              service:
                name: ml-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-app
                port:
                  number: 3000
